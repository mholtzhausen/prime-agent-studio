name: Linux desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build (for example v3.4.1)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Validate tag and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag and package version must match" >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret" >&2
            exit 1
          fi
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup default stable
      - run: npm ci
      - name: Prepare isolated compatible engine for integration tests
        run: node scripts/prepare-release-test-engine.mjs
      - run: node --test --test-concurrency=2 test/*.test.mjs
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build signed Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build
      - run: npm run desktop:manifest
      - name: Prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft /tmp/release.json)" != "true" ]]; then
              echo "Refusing to replace assets on a published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Prime Agent Studio $RELEASE_TAG" --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json body --jq .body > .local/release-notes.md
          npm run desktop:manifest -- .local/release-notes.md
          mapfile -t artifacts < <(find ".local/desktop-release/$RELEASE_TAG" -type f)
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
